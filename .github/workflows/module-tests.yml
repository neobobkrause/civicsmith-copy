# The required run of Process4 (build text 1, section 5). Copied into a product as
# .github/workflows/module-tests.yml. GitHub requires the check named `module-tests`.
# Tests run once, in the session that owns the work (`p4 test`), which writes the test record
# on the pull request (<!-- process4-test-record -->). This run runs no test, no product code,
# and installs none of the product's dependencies: with the read-only token it reads the job
# block and the test record, and passes where the scope is nothing or the record stands for the
# head commit (`run verdict`).
# The tool is fetched at the commit the BASE branch's process.json names, so a pull request
# cannot move the version that judges it.
name: module-tests
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: module-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the process version the base names
        id: pin
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git rev-list --parents -n 1 HEAD | awk 'NF==3 {print $2}'); base=${base:-$BASE}
          if cfg=$(git show "$base:process.json" 2>/dev/null); then :;
          elif cfg=$(git show "HEAD:process.json" 2>/dev/null); then echo "::notice::the base has no process.json; the head's names the tool's version"
          else echo "Scope: nothing, because there is no process.json in the base or the head. Passed at once." | tee -a "$GITHUB_STEP_SUMMARY"; echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "repository=$(echo "$cfg" | jq -r '.process.repository')" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "$cfg" | jq -r '.process.commit')" >> "$GITHUB_OUTPUT"
          echo "node=$(echo "$cfg" | jq -r '.node // "22"')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.pin.outputs.none != 'true'
        with:
          node-version: ${{ steps.pin.outputs.node }}
      # The tool's own dependencies only; none of the product's.
      - name: fetch the tool
        if: steps.pin.outputs.none != 'true'
        env:
          REPO: ${{ steps.pin.outputs.repository }}
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          git clone -q "$REPO" "$RUNNER_TEMP/process4"
          git -C "$RUNNER_TEMP/process4" checkout -q "$COMMIT"
          (cd "$RUNNER_TEMP/process4/tool" && npm ci --no-audit --no-fund --loglevel=error)
      # A job's pull request carries its job block, the comment beginning <!-- process4-job -->
      # (build text 5, section 5), and any pull request that ran its tests carries its test record,
      # the comment beginning <!-- process4-test-record -->. Both are read with the read-only token,
      # through gh's REST interface; the first of each is taken. Where one cannot be read, its file
      # is left empty: no job block, or no record.
      - name: the job block and the test record
        if: steps.pin.outputs.none != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          read_mark() {
            if ! gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
                --jq ".[] | select(.body | startswith(\"<!-- $1 -->\")) | .body" > "$2"; then
              echo "::notice::the comment marked $1 could not be read"
              : > "$2"
            fi
          }
          : > "$RUNNER_TEMP/job-block.txt"
          case "$HEAD_REF" in job/*) read_mark process4-job "$RUNNER_TEMP/job-block.txt" ;; esac
          read_mark process4-test-record "$RUNNER_TEMP/test-record.txt"
      - name: the verdict
        if: steps.pin.outputs.none != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN
          node "$RUNNER_TEMP/process4/tool/p4.mjs" run verdict --base "$BASE" --base-ref "$BASE_REF" --branch "$HEAD_REF" --draft "$DRAFT" --head "$HEAD_SHA" --job-block "$RUNNER_TEMP/job-block.txt" --test-record "$RUNNER_TEMP/test-record.txt"
